name: runbow007

services:
  app:
    build:
      context: .
    image: runbow007:local
    init: true
    ipc: host
    # 服务器只有 2 GiB 内存。2026-08-17 晚上一个卡死的 headless Chromium（当时正在
    # 渲染继承来的 12644 行错误视图）把内存吃干净，sshd fork 不出子进程，SSH 和
    # 阿里云命令助手同时失联，最后只能强制重启。加上限之后撑爆的是容器，机器还活着。
    mem_limit: 1200m
    mem_swappiness: 0
    env_file:
      - ${RUNBOW007_SECRETS_FILE:-./secrets.env}
    environment:
      TZ: Asia/Shanghai
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RUNBOW007_TMS_DOWNLOAD_TIMEOUT_SECONDS: "600"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./browser-profile:/app/browser-profile
    security_opt:
      - no-new-privileges:true

  # 人工上传兜底页面。常驻服务，使用不含浏览器的轻量镜像；它和一次性的 app
  # 共用配置、数据库和下载目录，内存上限也可以更小。
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: runbow007-lite-web:latest
    init: true
    restart: unless-stopped
    mem_limit: 600m
    mem_swappiness: 0
    env_file:
      - ${RUNBOW007_SECRETS_FILE:-./secrets.env}
    environment:
      TZ: Asia/Shanghai
    command: ["--config", "/app/config.yaml", "web"]
    ports:
      - "${RUNBOW007_WEB_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
